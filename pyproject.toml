[project]
name = "deep-research-agents"
version = "0.1.0"
description = "Autonomous multi-agent deep research framework for systematic web exploration, parallel scraping, and analytical synthesis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckduckgo-search>=7.0.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
